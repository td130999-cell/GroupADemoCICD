name: CI/CD Build and Sync to All Members

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # 1. Job build image trên cloud của GitHub
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 2. Job kéo image và chạy trực tiếp trên máy cá nhân của bạn
  deploy-to-local:
    name: Auto Deploy on My PC
    needs: build-and-push
    runs-on: [self-hosted, demo-node]

    steps:
      - name: Pull and run latest Docker container
        shell: powershell
        run: |
          Write-Host "Dang tai image moi nhat ve may..."
          docker pull ghcr.io/${{ github.repository }}:latest

          Write-Host "Xoa container cu..."
          docker rm -f my-demo-app -ErrorAction SilentlyContinue

          Write-Host "Khoi dong container moi..."
          docker run -d --name my-demo-app -p 8080:80 --restart always ghcr.io/${{ github.repository }}:latest
          
          Write-Host "Thanh cong! Hay kiem tra lai localhost:8080"