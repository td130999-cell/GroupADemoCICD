name: CI/CD Build and Auto Deploy to Local Machine

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # ========================================================
  # GIAI ĐOẠN 1: Build Docker Image trên GitHub Cloud
  # ========================================================
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # GIAI ĐOẠN 2: Tự động đánh thức máy khác để Deploy & Chạy Database
  # ========================================================
  deploy-to-local-machine:
    needs: build-and-push
    runs-on: self-hosted # Chạy trực tiếp trên "máy khác" đã cài Runner

    steps:
      - name: Kéo code mới nhất về máy
        uses: actions/checkout@v4

      - name: Cập nhật Docker Container (App & MySQL)
        run: |
          docker compose pull app
          docker compose up -d

      - name: Chờ Database MySQL sẵn sàng
        shell: powershell
        run: |
          Write-Host "Dang cho MySQL khoi dong hoan tat..."
          docker compose exec -T database mysqladmin ping -h localhost -u root -proot_admin_password --silent

      - name: TỰ ĐỘNG CHẠY SCRIPT CẤU HÌNH VÀ CẬP NHẬT DATABASE
        shell: powershell
        run: |
          Write-Host "Dang chay script cap nhat Database MySQL..."
          # Tự động nạp file 01-init.sql hoặc các file migration vào Database
          Get-Content ./init-db/01-init.sql | docker compose exec -T database mysql -u root -proot_admin_password demo_db
          Write-Host "CAP NHAT DATABASE THANH CONG 100%!"